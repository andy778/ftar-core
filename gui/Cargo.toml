[package]
name = "ftar-gui"
version = "0.1.0"
edition = "2021"
description = "egui front end for ftar-core"
license = "GPL-2.0-or-later"

[[bin]]
name = "ftar-gui"
path = "src/main.rs"

[dependencies]
ftar-core = { path = ".." }
eframe = "0.37"
rfd = "0.18"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
