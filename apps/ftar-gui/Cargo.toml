[package]
name = "ftar-gui"
version = "0.1.0"
edition.workspace = true
description = "egui front end for ftar-core"
license.workspace = true

[[bin]]
name = "ftar-gui"
path = "src/main.rs"

[dependencies]
ftar-core = { path = "../../crates/core" }
ftar-render = { path = "../../crates/render" }
eframe = "0.37"
rfd = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }

[lints]
workspace = true
