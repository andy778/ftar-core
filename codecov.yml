# Codecov settings. Coverage is informational in ftar (no threshold): Codecov reports project and
# patch coverage on pull requests but never fails them. Mutation testing (mutants.yml) is the gate
# for whether changed code is really tested.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
comment:
  layout: "condensed_header, diff, files"
  require_changes: true
ignore:
  - "xtask"
