[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
edition = "2021"
license = "GPL-2.0-or-later"
rust-version = "1.95"
repository = "https://github.com/andy778/ftar-core"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# A function too tangled to follow (nesting, branches, early exits). Threshold in clippy.toml.
cognitive_complexity = "warn"
