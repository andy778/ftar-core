name: Bug report
description: A wrong result, a crash, or something that doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems are welcome here too; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command (e.g. `ftar prob tree.fta --order 3`) or the GUI steps.
      placeholder: |
        1. ftar prob tree.fta
        2. ...
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Tree and database files
      description: "Attach the smallest tree that shows the problem. GitHub does not accept `.fta` or `.ped` files, so put them in a `.zip` and attach that (`ftar bundle tree.fta`, or File > Export bug report bundle, makes one), or add `.txt` to the name, e.g. `Test1.fta.txt`. Without the tree we usually cannot reproduce the problem."
  - type: textarea
    id: openfta
    attributes:
      label: OpenFTA result (if you have it)
      description: What the original OpenFTA reports for the same tree, if this is a difference in numbers.
  - type: input
    id: version
    attributes:
      label: ftar version
      description: Release tag (e.g. v0.2.0), or the commit if you built from source.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Where
      multiple: true
      options: [CLI, GUI, MCP server / automation, Reports, Analysis results, Other]
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, Ubuntu 24.04, macOS 15
