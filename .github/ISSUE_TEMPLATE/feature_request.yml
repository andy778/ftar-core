name: Feature request
description: Something ftar should do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The task or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How it could work. Say if OpenFTA already does this and how.
  - type: dropdown
    id: part
    attributes:
      label: Where
      multiple: true
      options: [CLI, GUI, MCP server / automation, Reports, Analysis, File formats, Other]
