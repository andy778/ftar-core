name: Release

# Builds optimised binaries (`ftar` CLI/MCP server and `ftar-gui`) for Linux, Windows and macOS.
#
# * push a tag `vX.Y.Z`  -> build everything, then publish a GitHub release with archives and checksums
# * pull request that touches the build files, or manual run -> build only (a dry run, nothing published)
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release tag must match the version in Cargo.toml, so the archives are named truthfully.
  check-version:
    name: Tag matches the crate version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Compare tag and ftar-cli version
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='ftar-cli'))")
          if [ "refs/tags/v${version}" != "${GITHUB_REF}" ]; then
            echo "tag ${GITHUB_REF#refs/tags/} does not match ftar-cli version ${version}"
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: [check-version]
    # run when check-version passed, or was skipped (dry runs)
    if: ${{ !cancelled() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p ftar-cli -p ftar-gui

      - name: Smoke test the CLI
        shell: bash
        run: |
          set -euo pipefail
          exe=target/${{ matrix.target }}/release/ftar
          [ "${{ runner.os }}" = "Windows" ] && exe="$exe.exe"
          "$exe" cutsets crates/core/tests/data/theatre.fta
          "$exe" tools > /dev/null
          "$exe" draw crates/core/tests/data/theatre.fta "$RUNNER_TEMP/smoke.png" --scale 1
          test -s "$RUNNER_TEMP/smoke.png"

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="ftar-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          mkdir "$name"
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/ftar$ext" "target/${{ matrix.target }}/release/ftar-gui$ext" "$name/"
          cp LICENSE NOTICE README.md "$name/"
          cp -r docs "$name/docs"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "file=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "$name.tar.gz" "$name"
            echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ftar-${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the provenance with Sigstore (keyless, GitHub OIDC)
      attestations: write # store the attestation on GitHub
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # SLSA build provenance for every archive and the checksum file, signed
      # with Sigstore. Verify with `gh attestation verify <file> --repo andy778/ftar-core`.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # Ship the signed bundle with the release too, so it can be verified offline
      # (`gh attestation verify <file> --bundle ftar-<tag>.sigstore.json`).
      - name: Add the signed provenance bundle to the release files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/ftar-${GITHUB_REF_NAME}.sigstore.json"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ftar ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
