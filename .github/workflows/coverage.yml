name: Coverage

# Line coverage of the workspace tests (cargo-llvm-cov, nextest), Linux only. Informational: no
# threshold. The per-file table is in the job summary; HTML and lcov are uploaded as artifacts,
# and on master the total is published for the README badge. Locally: `cargo xtask coverage`.
on:
  push:
    branches: [master]
  pull_request:
    paths: ["**/*.rs", "**/Cargo.toml", "Cargo.lock", ".github/workflows/coverage.yml", ".github/scripts/publish-badge.sh"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: cargo llvm-cov
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      lines: ${{ steps.reports.outputs.lines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.150,cargo-llvm-cov@0.9.2
      - name: Linux GUI build deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Run the tests with coverage
        run: cargo llvm-cov nextest --workspace --exclude xtask --no-report
      - name: Reports
        id: reports
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html
          cargo llvm-cov report --summary-only > summary.txt
          lines=$(awk '/^TOTAL/ {print $10}' summary.txt)
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          {
            echo "### Line coverage"
            echo "Total: $lines of lines"
            echo
            echo '<details><summary>Per file</summary>'
            echo
            echo '```'
            cat summary.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            lcov.info
            target/llvm-cov/html
          if-no-files-found: error
          retention-days: 14

  # The total line coverage of master, for the README badge: a shields.io endpoint file on the
  # `badges` branch. A job of its own, so the job that runs the tests cannot write to the repo.
  badge:
    name: Coverage badge
    needs: coverage
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push badges/coverage.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Badge file
        env:
          LINES: ${{ needs.coverage.outputs.lines }}
        run: |
          set -euo pipefail
          if ! [[ "$LINES" =~ ^[0-9]+(\.[0-9]+)?%$ ]]; then echo "no coverage total: '$LINES'"; exit 1; fi
          whole=${LINES%%[.%]*}
          if   [ "$whole" -ge 90 ]; then color=brightgreen
          elif [ "$whole" -ge 80 ]; then color=green
          elif [ "$whole" -ge 70 ]; then color=yellowgreen
          elif [ "$whole" -ge 60 ]; then color=yellow
          else color=red; fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s","color":"%s"}\n' \
            "$LINES" "$color" > "$RUNNER_TEMP/coverage.json"
          cat "$RUNNER_TEMP/coverage.json"
      - name: Publish to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-badge.sh "$RUNNER_TEMP/coverage.json"
