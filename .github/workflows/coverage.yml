name: Coverage

# Line coverage of the workspace tests (cargo-llvm-cov, nextest), Linux only. Informational: no
# threshold. The per-file table is in the job summary; HTML and lcov are uploaded as artifacts,
# and lcov goes to Codecov (the README badge). Locally: `cargo xtask coverage`.
on:
  push:
    branches: [master]
  pull_request:
    paths: ["**/*.rs", "**/Cargo.toml", "Cargo.lock", ".github/workflows/coverage.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: cargo llvm-cov
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # Codecov upload authenticates with the job's OIDC token, no stored secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.150,cargo-llvm-cov@0.9.2
      - name: Linux GUI build deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Run the tests with coverage
        run: cargo llvm-cov nextest --workspace --exclude xtask --no-report
      - name: Reports
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html
          cargo llvm-cov report --summary-only > summary.txt
          {
            echo "### Line coverage"
            echo "Total: $(awk '/^TOTAL/ {print $10}' summary.txt) of lines"
            echo
            echo '<details><summary>Per file</summary>'
            echo
            echo '```'
            cat summary.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            lcov.info
            target/llvm-cov/html
          if-no-files-found: error
          retention-days: 14
      # Not fatal: Codecov being down, or a fork PR without an OIDC token, must not fail the PR.
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
