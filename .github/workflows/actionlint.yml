name: Workflow lint

# actionlint (with shellcheck for `run:` scripts) over the workflows, in seconds and without a
# Rust build, so a broken workflow fails here instead of after it is merged.
on:
  push:
    branches: [master]
    paths: [".github/workflows/**", ".github/actionlint.yaml"]
  pull_request:
    paths: [".github/workflows/**", ".github/actionlint.yaml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: actionlint@1.7.12
      # shellcheck is preinstalled on the Ubuntu runner; actionlint uses it for `run:` blocks.
      - name: actionlint
        run: actionlint -color
